services:
  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  apigateway:
    build: ./apigateway
    container_name: apigateway
    ports:
      - "8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  productservice:
    build: ./productService
    container_name: productservice
    ports:
      - "8081:8081"
    depends_on:
      eurekaserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  importservice:
    build: ./importService
    container_name: importservice
    ports:
      - "8082:8082"
    depends_on:
      eurekaserver:
        condition: service_healthy
      productservice:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker